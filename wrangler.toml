name = "lumo-ecommerce-platform"
main = "server.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
NODE_ENV = "production"
PLATFORM_NAME = "LUMO Multi-Vendor Marketplace"
DEFAULT_CURRENCY = "TZS"

[[d1_databases]]
binding = "DB"
database_name = "lumo-prod"
database_id = "lumo-prod-d1-id"
migrations_dir = "migrations"

[site]
bucket = "./dist"
